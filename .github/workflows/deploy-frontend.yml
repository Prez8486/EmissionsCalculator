name: Deploy Frontend to Nectar Cloud

on:
  push:
    branches:
      - Main   # or replace with 'frontend' if separate branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build Vue app
        run: |
        
          npm install
          npm run build

      

      